$schema: https://intentional.foo/schemas/config.yml
contract: contract-2
settings:
  internal-dependency-bump: patch
discovery:
  managed-paths:
    - detector: go-module
      path: go.mod
      release-unit: wyrwood
release-units:
  wyrwood:
    path: .
    projections:
      - adapter: go
        file: go.mod
        mode: none
      - adapter: yaml
        file: docs/user/docs.yml
        mode: committed
        pointer: /products/wyrwood/version
    tags:
      primary:
        role: primary
        template: '{version}'
  wyrwood-docs:
    path: docs/user
    depends-on: [ wyrwood ]
    projections:
      - adapter: yaml
        file: docs.yml
        mode: committed
        pointer: /products/wyrwood/docs-version
    tags:
      primary:
        role: primary
        template: 'wyrwood-docs@{version}'
