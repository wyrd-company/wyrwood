# ---
# relationships:
#   publishes: docs
#   uses: wyrd-foo-publish-docs
# ---

name: Publish to wyrd.foo

# The docs publish for a delivered release: when the Release workflow succeeds
# for a pushed code tag (so the GitHub Release the publisher reads exists), on
# a push of a docs tag, and by manual run. The docs come from the tag, and a
# plain push to main does not publish. The publisher computes every product
# from the files at the ref, so a manual run re-publishes any existing tag.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [ Release ]
    types: [ completed ]
  push:
    tags:
      - "wyrwood-docs@*"
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or commit to publish
        required: true
        type: string
      feature:
        description: Feature a product on the front page
        type: boolean
        default: false
      feature-product:
        description: The product key to feature; empty when the repo has one product
        type: string
        default: ""
      feature-days:
        description: How long the feature lasts, in days
        type: string
        default: "14"
      feature-reason:
        description: For example "New MCP server"; default "New release"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  publish:
    name: Publish to wyrd.foo
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    # ryl disable-line rule:line-length
    uses: wyrd-company/wyrd.foo/.github/workflows/publish-docs.yml@0ce207a3f07f2ee06eea5cf3354a88314ee72923 # 2.2.1
    with:
      # A Release run's head branch is the code tag it ran for.
      ref: ${{ inputs.ref || github.event.workflow_run.head_branch || github.ref_name }}
      feature: ${{ inputs.feature || false }}
      feature-product: ${{ inputs.feature-product || '' }}
      feature-days: ${{ inputs.feature-days || '14' }}
      feature-reason: ${{ inputs.feature-reason || '' }}
    secrets:
      WYRD_TOOLS_DOCS_PUBLISHER_APP_ID: ${{ secrets.WYRD_TOOLS_DOCS_PUBLISHER_APP_ID }}
      WYRD_TOOLS_DOCS_PUBLISHER_PRIVATE_KEY: ${{ secrets.WYRD_TOOLS_DOCS_PUBLISHER_PRIVATE_KEY }}
