# ---
# relationships:
#   validates: Taskfile
# ---

name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  check:
    name: Repository checks
    runs-on: ubuntu-latest
    env:
      OPENBAO_VERSION: 2.7.2
      WYRWOOD_TEST_IMAGE: alpine:3.22
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"

      - name: Enable pnpm through Corepack
        working-directory: internal/web/frontend
        run: |
          npm install --global corepack
          corepack enable

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install repository check tools
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/go-task/task/v3/cmd/task@v3.52.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          python3 -m venv "$RUNNER_TEMP/ci-linters"
          "$RUNNER_TEMP/ci-linters/bin/pip" install -r .github/requirements-ci.txt
          echo "$RUNNER_TEMP/ci-linters/bin" >> "$GITHUB_PATH"

      - name: Install OpenBao
        shell: bash
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/openbao"
          mkdir -p "$directory"
          cd "$directory"
          archive="openbao_${OPENBAO_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/openbao/openbao/releases/download/v${OPENBAO_VERSION}"
          curl --fail --location --output "$archive" "$base/$archive"
          curl --fail --location --output checksums.txt "$base/checksums.txt"
          grep "  $archive\$" checksums.txt | sha256sum --check --strict
          tar -xzf "$archive" bao
          "$directory/bao" version
          echo "WYRWOOD_BAO=$directory/bao" >> "$GITHUB_ENV"

      - name: Prepare real-engine tests
        shell: bash
        run: |
          set -euo pipefail
          docker info
          docker pull "$WYRWOOD_TEST_IMAGE"

      - name: Validate repository
        run: task ci

  docs-publisher:
    name: Docs publisher check
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"

      - name: Install Corepack
        run: npm install --global corepack

      # The same command as `task docs:publisher`. It reads the publisher pin
      # from publish-docs.yml and needs no token, secret, or release tag.
      - name: Check docs.yml with the pinned publisher
        run: python3 scripts/check-docs-publisher.py

  image:
    name: Controller image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build the image and run its executable
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --build-arg VERSION=ci --tag wyrwood-ci:image --load .
          docker run --rm --entrypoint /usr/bin/wyrwood wyrwood-ci:image version
