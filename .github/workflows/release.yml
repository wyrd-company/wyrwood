# ---
# relationships: {}
# ---

name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, such as 1.2.3
        required: true
        type: string

permissions:
  contents: read

# The docs unit tags the same commit (wyrwood-docs@<version>), so the
# release tag is passed explicitly: GoReleaser can pick either tag.
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  compatibility:
    name: Prove package publisher compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Commit A must pin the reviewed inbox, allowlist, and package-stage contract.
    # The non-SHA sentinel deliberately blocks every release until it is replaced.
    env:
      REPO_WYRD_FOO_PUBLISHER_COMMIT: a6963dc818e3c98bf31ff62544d333eacd91b67f
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Validate release and publisher pins
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          then
          echo "Release tags must be bare stable SemVer values." >&2
          exit 1
          fi
          if [[ ! "$REPO_WYRD_FOO_PUBLISHER_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          then
          echo "Replace the repo.wyrd.foo publisher sentinel with Commit A before releasing." >&2
          exit 1
          fi

      - name: Check out pinned package publisher contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: wyrd-company/repo.wyrd.foo
          ref: ${{ env.REPO_WYRD_FOO_PUBLISHER_COMMIT }}
          path: .repo-wyrd-foo-contract
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Enable pnpm through Corepack
        working-directory: internal/web/frontend
        run: corepack enable

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install package inspectors
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm

      - name: Build and stage through the publisher contract
        shell: bash
        run: >-
          go run github.com/go-task/task/v3/cmd/task@v3.52.0
          release:compatibility
          PUBLISHER_ROOT=.repo-wyrd-foo-contract
          PUBLISHER_COMMIT="$REPO_WYRD_FOO_PUBLISHER_COMMIT"
          RELEASE_VERSION="$RELEASE_TAG"
          RELEASE_COMMIT="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"

  release:
    name: Build and publish release
    needs: compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Validate stable release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          then
          echo "Release tags must be bare stable SemVer values." >&2
          exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Enable pnpm through Corepack
        working-directory: internal/web/frontend
        run: corepack enable

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate repository
        run: go run github.com/go-task/task/v3/cmd/task@v3.52.0 release:ci

      - name: Build and publish GitHub release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ env.RELEASE_TAG }}

      - name: Create package repository handoff
        shell: bash
        env:
          RELEASE_VERSION: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          commit="$(git rev-list -n 1 "refs/tags/$RELEASE_VERSION")"
          scripts/create-release-manifest.py \
          --artifacts-dir dist \
          --version "$RELEASE_VERSION" \
          --commit "$commit" \
          --output dist/release-manifest.json

      - name: Preserve package repository handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-release-manifest
          path: dist/release-manifest.json
          if-no-files-found: error
          retention-days: 90
