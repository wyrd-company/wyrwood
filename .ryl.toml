# ---
# relationships:
#   supports: Taskfile
# ---

# Keep repository lint rules independent of user-level configuration.
[lint.rules.braces]
level = "error"
forbid = false
min-spaces-inside = 1
max-spaces-inside = 2
min-spaces-inside-empty = 0
max-spaces-inside-empty = 0

[lint.rules.brackets]
level = "error"
forbid = false
min-spaces-inside = 1
max-spaces-inside = 1
min-spaces-inside-empty = 0
max-spaces-inside-empty = 0

[lint.rules.colons]
level = "error"
max-spaces-before = 0
max-spaces-after = 1

[lint.rules.commas]
level = "error"
max-spaces-before = 0
min-spaces-after = 1
max-spaces-after = 1

[lint.rules.empty-lines]
level = "error"
max = 1
max-start = 0
max-end = 0

[lint.rules.hyphens]
level = "error"
max-spaces-after = 1
dash-on-own-line = false

[lint.rules.indentation]
level = "error"
spaces = 2
indent-sequences = true
check-multi-line-strings = true

[lint.rules.line-length]
level = "warning"
max = 100
allow-non-breakable-words = true
allow-non-breakable-inline-mappings = true

[lint.rules.new-line-at-end-of-file]
level = "error"

[lint.rules.trailing-spaces]
level = "error"

[lint.rules.document-end]
level = "error"
present = false

[lint.rules.document-start]
level = "error"
present = false

[lint.rules.empty-values]
level = "error"
forbid-in-block-mappings = false
forbid-in-flow-mappings = true
forbid-in-block-sequences = true

[lint.rules.key-duplicates]
level = "error"
forbid-duplicated-merge-keys = false
check-canonical = false              # ryl-only
forbid-merge-key-shadowing = false   # ryl-only

# pnpm 12 owns both lockfile documents and rewrites their formatting on startup.
[lint.per-file-ignores]
"internal/web/frontend/pnpm-lock.yaml" = ["braces", "brackets", "document-start"]
