# ---
# relationships: {}
# ---

version: "3"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  frontend:install:
    run: once
    desc: Install the locked frontend dependencies
    dir: internal/web/frontend
    sources:
      - package.json
      - pnpm-lock.yaml
    generates:
      - node_modules/.modules.yaml
    cmds:
      - corepack pnpm install --frozen-lockfile

  frontend:build:
    run: once
    desc: Build the React interface for embedding in the Go binary
    dir: internal/web/frontend
    deps: [ frontend:install ]
    sources:
      - src/**/*
      - public/**/*
      - index.html
      - package.json
      - pnpm-lock.yaml
      - tsconfig.json
      - vite.config.ts
    generates:
      - ../dist/index.html
      - ../dist/assets/*
    cmds:
      - corepack pnpm run build

  frontend:check:
    desc: Type-check, format-check, and test the React interface
    dir: internal/web/frontend
    deps: [ frontend:install ]
    cmds:
      - corepack pnpm run check

  frontend:test:build:
    desc: Build the React renderer used by the Go workflow tests
    dir: internal/web/frontend
    deps: [ frontend:install ]
    cmds:
      - corepack pnpm run build:test

  frontend:test:
    desc: Test the React interface
    dir: internal/web/frontend
    deps: [ frontend:install ]
    cmds:
      - corepack pnpm run test

  format:
    desc: Format Go source files
    cmds:
      - gofmt -w .

  format:check:
    desc: Check Go source formatting
    cmds:
      - test -z "$(gofmt -l .)"

  test:
    desc: Run the Go and React test suites
    deps: [ frontend:build, frontend:test:build, frontend:test ]
    cmds:
      - go test ./...

  test:ci:
    desc: Run uncached tests and reject missing integration prerequisites
    deps: [ frontend:build, frontend:test:build, frontend:test ]
    cmds:
      - bash scripts/test-ci.sh

  test:ci-runner:
    desc: Test the CI runner's handling of failures and missing prerequisites
    cmds:
      - python3 -m unittest scripts/test-ci_test.py

  ci:
    desc: Run all checks and require OpenBao and real-engine tests to execute
    cmds:
      - task: check
        vars:
          TEST_TASK: test:ci

  test:engine-proxy:root:
    desc: Prove Engine proxy Unix permissions with separate real Linux UIDs
    cmds:
      - go test -c -o .tmp/engineproxy.test ./internal/engineproxy
      - sudo -n .tmp/engineproxy.test -test.v -test.run 'TestRoot|TestRawEngineAccessGuard'
      - go test -c -o .tmp/consumer.test ./internal/consumer
      - sudo -n .tmp/consumer.test -test.v -test.run TestRootProcessGroupCapabilities
      - go test -c -o .tmp/linuxservice.test ./internal/linuxservice
      - sudo -n .tmp/linuxservice.test -test.v -test.run TestRootPackage

  test:release-manifest:
    desc: Test the package release manifest generator
    cmds:
      - python3 -m unittest scripts/create-release-manifest_test.py

  test:integration:linux:
    desc: >-
      Run the real Linux integration gate as root with Docker Engine, bao,
      the devcontainer CLI, and sshd (WYRWOOD_GATE_IMAGE overrides the image)
    deps: [ frontend:build ]
    cmds:
      - go test -count=1 -tags=integration ./internal/integration

  vet:
    desc: Run Go static analysis
    deps: [ frontend:build ]
    cmds:
      - go vet ./...

  scripts:check:
    desc: Check release automation scripts and publishing contracts
    cmds:
      - bash -n scripts/*.sh
      - python3 -m py_compile scripts/*.py
      - python3 scripts/check-release-toolchain.py
      - cd scripts && ./check-publishing-secret-contract.sh

  demo:
    desc: >-
      Record docs/user/assets/demo.gif and the web interface screenshots
      (needs Docker Engine, sudo, agent-browser, vhs, ffmpeg, and gifsicle)
    cmds:
      - docs/demo/record.sh

  docs:screenshots:
    desc: Refresh real UI screenshots using the isolated demo site (no CLI GIF)
    cmds:
      - docs/demo/record.sh --screenshots

  docs:media:check:
    desc: Check screenshot freshness and local user documentation links
    cmds:
      - python3 -m unittest discover -s docs/demo -p 'test_*.py'
      - python3 docs/demo/check.py

  docs:check:
    desc: Lint repository artifacts
    cmds:
      - task: docs:media:check
      - rumdl check .
      - ryl check . --markdown

  build:
    desc: Build the Wyrwood executable
    deps: [ frontend:build ]
    cmds:
      - go build ./cmd/wyrwood

  release:check:
    desc: Validate the GoReleaser configuration
    cmds:
      - go run github.com/goreleaser/goreleaser/v2@v2.19.0 check .goreleaser.yaml

  release:ci:
    desc: Run portable validation required before a release
    deps:
      - frontend:check
      - build
      - format:check
      - release:check
      - scripts:check
      - test
      - test:release-manifest
      - test:ci-runner
      - vet

  release:compatibility:
    desc: Build packages and prove the pinned repository publisher contract
    requires:
      vars:
        - PUBLISHER_ROOT
        - PUBLISHER_COMMIT
        - RELEASE_VERSION
        - RELEASE_COMMIT
    deps:
      - release:ci
    cmds:
      - >-
          RELEASE_VERSION="{{.RELEASE_VERSION}}"
          go run github.com/goreleaser/goreleaser/v2@v2.19.0
          release --snapshot --clean
      - >-
          scripts/create-release-manifest.py
          --artifacts-dir dist
          --version "{{.RELEASE_VERSION}}"
          --commit "{{.RELEASE_COMMIT}}"
          --output dist/release-manifest.json
      - >-
          scripts/validate-publisher-contract.sh
          "{{.PUBLISHER_ROOT}}"
          "{{.PUBLISHER_COMMIT}}"
          dist/release-manifest.json
          dist
          dist/publisher-contract

  release:snapshot:
    desc: Build local release artifacts without publishing
    deps: [ frontend:build ]
    cmds:
      - >-
          RELEASE_VERSION="${RELEASE_VERSION:-0.0.0}"
          go run github.com/goreleaser/goreleaser/v2@v2.19.0
          release --snapshot --clean

  workflows:check:
    desc: Validate GitHub Actions workflows
    cmds:
      - actionlint

  check:
    desc: Run all repository checks
    deps:
      - frontend:check
      - build
      - docs:check
      - format:check
      - release:check
      - scripts:check
      - task: '{{default "test" .TEST_TASK}}'
      - test:release-manifest
      - test:ci-runner
      - vet
      - workflows:check
