slug: agent-compromise-exposes-host-container-secrets
title: A compromised agent exposes every container's policy scope on that host
description: >-
  The agent holds, in memory, one OpenBao token per bound container and the SSH
  key that identifies the host to the controller. Its user belongs to the
  docker group, which grants full control of the Docker engine whatever the
  agent configuration says. A process that compromises the agent can read any
  secret any container on that host is allowed to read, sign with any key any
  container is allowed to use, and create, change, or remove any container on
  the host, including privileged containers with the host filesystem mounted.
  Mitigation: the agent runs as a dedicated user with no login shell; tokens
  are bounded by each binding's OpenBao policy and expire on the AppRole's
  schedule; the agent stores nothing on disk except its own SSH key, the
  accepted controller host key, the cached policy, operational events, and
  recreate journals, never a token or secret; the agent itself makes engine
  writes only to recreate, only when a policy opts into recreate and the host's
  agent configuration allows it, which limits what a defect in the agent can
  change but not what a process with the agent's identity can do; private
  keys never exist on the host because signing happens in OpenBao; the
  controller can delete a host's AppRoles, revoke each binding's current
  token by the accessor the agent reported, and reject its agent key at any
  time; tokens live at most the policy's maximum lifetime;
  operational events show which container used which key.
categories:
  - security
  - operational
likelihood: 2
impact: 5
response-strategy: mitigate
status: open
