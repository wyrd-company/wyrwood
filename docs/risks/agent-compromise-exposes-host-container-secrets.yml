slug: agent-compromise-exposes-host-container-secrets
title: A compromised agent exposes every container's policy scope on that host
description: >-
  The agent holds one OpenBao token per bound container and the SSH key that
  identifies the host to the controller. A compromised agent can read secrets
  in those policies and sign with their keys. Engine inspect access also
  exposes host container environment values and metadata. The wyrwood user
  has no docker membership or direct Engine socket access. The separate
  wyrwood-engine proxy enforces an exact read allow-list and independently
  denies stop, remove, create, and start when the root-controlled host
  allow-recreate setting is false. With that setting true, a compromised
  agent can remove any container and create/start privileged containers with
  host mounts; host takeover remains possible. The proxy itself retains
  docker group authority and is part of the trusted host boundary.
  Mitigation: both identities have no login shell; protected configuration
  and socket directories prevent the agent from changing the host permission
  or replacing its listener; peer UID checks restrict proxy clients; service
  upgrades drop both stored docker membership and old process groups.
  Tokens remain bounded by binding policy and expire on the AppRole schedule.
  The agent stores its key, accepted controller key, cached policy, events,
  and recreate journals, never tokens or container create payloads. Private
  signing keys remain in OpenBao. The controller can revoke binding tokens
  by their reported accessors and reject the host key. The risk remains open
  for in-memory credentials, inspect metadata, and recreate-enabled hosts.
categories:
  - security
  - operational
likelihood: 2
impact: 5
response-strategy: mitigate
status: open
