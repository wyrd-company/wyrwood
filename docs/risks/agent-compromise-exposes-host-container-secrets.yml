slug: agent-compromise-exposes-host-container-secrets
title: A compromised agent exposes every container's policy scope on that host
description: >-
  The agent holds, in memory, one OpenBao token per bound container and the SSH
  key that identifies the host to the controller. It also reaches the Docker
  engine. A process that compromises the agent can read any secret any
  container on that host is allowed to read, sign with any key any container is
  allowed to use, and when recreate is enabled, change container definitions.
  Mitigation: the agent runs as a dedicated user with no login shell; tokens
  are bounded by each binding's OpenBao policy and expire on the AppRole's
  schedule; the agent stores nothing on disk except its own SSH key and
  the cached policy, never a token or secret; engine write operations are off
  unless a policy opts into recreate and the host's agent configuration allows
  it; private keys never exist on the host because signing happens in OpenBao;
  the controller can revoke a host's AppRoles and reject its agent key at any
  time; operational events show which container used which key.
categories:
  - security
  - operational
likelihood: 2
impact: 4
response-strategy: mitigate
status: open
