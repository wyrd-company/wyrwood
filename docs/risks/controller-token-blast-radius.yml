slug: controller-token-blast-radius
title: The controller's OpenBao credential can write policy
description: >-
  The controller holds the only Wyrwood credential able to create OpenBao
  policies and AppRoles. Compromise of the controller grants the ability to
  grant any container any access the controller's own OpenBao policy allows.
  Mitigation: the controller's OpenBao policy is limited to a Wyrwood prefix
  for policies, AppRoles, Transit keys, and wrapping; the controller runs as a
  container with its credential supplied as a mounted file rather than an
  environment variable; the web interface binds to a local or reverse-proxied
  address; agents authenticate with approved keys only; every policy and
  binding change is an operational event.
categories:
  - security
likelihood: 2
impact: 4
response-strategy: mitigate
status: open
