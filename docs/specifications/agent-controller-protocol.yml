$schema: https://refinery.systems/ontology/specification
relationships:
  references:
    - policy
format: json-schema
description: >-
  Effective assignment openbao.agent-token-renewal is the resolved boolean
  controlling actual agent renewal. Any enabled selected policy enables it.
  Updated agents infer the existing HCL capability when this field is absent.
  Agents are upgraded before controllers publish the resolved field; older
  agents reject unknown effective-assignment fields.

  Agents and the controller exchange newline-delimited JSON messages over the
  `wyrwood` SSH subsystem on an authenticated SSH connection. Message shapes
  are defined by `assets/agent-controller-protocol/message.schema.json`.
  Every message has integer `version` 2 and a `type`. A line is at most 1 MiB.
  Unknown fields are rejected.

  Authentication is SSH public key only. The username is the agent's
  hostname. A key the controller has not approved receives an authentication
  failure identical to an unknown key. The controller presents one host key;
  the agent verifies it against the fingerprint accepted at login and
  refuses to connect on mismatch.

  Agent to controller: `hello` carries the optional agent build version and
  whether recreate is allowed on the host. An omitted version is unknown; the
  controller accepts the session. `inventory` carries the complete current container
  list; each entry has the engine identifier, name, state, image reference,
  candidate keys in precedence order as `{kind, value}` with kinds
  `devcontainer`, `compose`, and `name`, and the contract check inputs:
  mounts as `{source, target}` and environment names present. The optional
  `consumer-directory` is the host source path computed by the agent from its
  configured consumers root and container name, including for containers that
  do not yet mount that path. A missing field means the directory is unknown.
  Upgrade the controller before agents that report this field: controllers
  reject unknown fields and close the session. The field is not negotiated;
  stored inventories without it remain valid.
  `contract-result`
  reports one container's conformance as `conforming`, `non-conforming` with
  failed item names, `recreating`, `recreated` with the new engine
  identifier, or `recreate-failed` with a categorical reason.
  `credential-request` names a binding whose token must be replaced.
  `token-accessor` carries a binding, assignment identity, and the accessor of the token the agent
  obtained for it. The agent sends it after each login and again on each new
  session and each full reconcile until the controller acknowledges it. The
  controller keeps the latest one per binding and uses it only to revoke that
  token when the binding changes or is deleted. An old-assignment or deleted
  binding accessor is revoked on arrival and cannot replace the current one.

  Controller to agent: `policy-set` carries every binding that matches a
  container in the latest inventory: binding identifier, the matched key, the
  effective policy (source names, revisions and HCL, combined HCL, SSH identity
  unions and forwarding restrictions, resolved contract and binding settings),
  assignment identity, the OpenBao address, CA,
  namespace, and the Transit and SSH-engine mount names the controller
  manages. `credential` carries a binding identifier, assignment identity, the AppRole mount and
  role identifier, and a response-wrapped secret identifier whose wrapping
  time-to-live is at most 5 minutes. `recreate-request` names a binding for
  an operator-requested recreate. `unbind` names a binding to retire.
  `result-recorded` acknowledges one `contract-result` by echoing its
  binding, outcome, and reason. The controller sends it only after it has
  stored the result, or discarded it because the binding no longer exists or
  belongs to another agent; a result it could not store is not acknowledged.
  The agent keeps a failed recreate's report until that acknowledgement
  arrives. `accessor-recorded` acknowledges one `token-accessor` by echoing
  its binding, assignment identity, and accessor, once the controller has stored it, revoked it for
  a deleted binding, or discarded it because the binding never belonged to
  the agent; a report the controller could not store or revoke is not
  acknowledged.

  Neither direction ever carries a token, an unwrapped secret identifier, an
  observed container environment value, or a secret value. Authored contract
  environment requirements are part of the effective assignment. A token accessor cannot
  authenticate; it names a token for revocation. The controller replaces an agent's
  existing session when the same approved key connects again. Version 1 has
  no adapter; controller and agents must upgrade together. The agent rejects
  stale assignment credentials and any token whose attached policies differ
  from the assignment's exact selected managed policy names.
validation-criteria: >-
  Round-trip tests validate every message against the schema asset and the
  Go types. Session tests cover that a contract result is acknowledged only
  after the controller stores it. Session tests cover unknown-key rejection, host-key mismatch,
  session replacement, oversize lines, and that no message serialization
  contains a token or secret identifier.
