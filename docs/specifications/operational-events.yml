$schema: https://refinery.systems/ontology/specification
relationships: {}
format: json-schema
description: >-
  Agent and controller operational history is a bounded sequence of closed
  event records defined by `assets/operational-events/operational-event.schema.json`.
  Each record has an RFC 3339 timestamp, a categorical `operation`, a
  categorical `outcome`, a non-negative latency in nanoseconds, and an
  optional categorical `error`. Agent records may carry the container key
  that identifies the consumer, the binding identifier, a key fingerprint
  for signing and certificate operations, and the OpenBao mount category for
  vault requests. Controller records may carry the agent name, binding
  identifier, and policy name. A fingerprint is intentionally correlatable
  across events.

  Records contain no token, secret identifier, wrapping token, HCL, request
  path beyond the mount category, request or response body, signature,
  public-key bytes, environment value, filesystem path, or raw engine, SSH,
  or OpenBao error text.

  The durable file format, framing, checksum, retention from 1 through
  100000 records, atomic compaction, and final-frame recovery follow the
  agent's event store. Health projections use the most recent retained event
  per binding and report only `unknown`, `healthy`, `denied`, or `degraded`.
validation-criteria: >-
  A record conforms when it validates against the schema asset and the Go
  validator accepts it. Reflection tests verify the event type has no
  open-ended fields. Storage tests verify owner-only modes, bounded retention,
  final-frame recovery, and atomic replacement. Integration gates scan
  projected and durable bytes for tokens, paths, and request material.
