$schema: https://refinery.systems/ontology/specification
relationships:
  references:
    - agent-controller-protocol
    - composable-policy-bindings
format: json-schema
description: >-
  A Wyrwood policy is the document the controller stores for each named
  policy. Agents receive a resolved effective assignment with source provenance.
  The reusable document structure
  is defined by `assets/policy/policy.schema.json`.

  `name` is a lower-kebab-case slug unique in the controller and is the suffix
  of the OpenBao policy name `wyrwood-<name>`. `openbao.policy` is the authored workload
  HCL policy document; the controller validates it through OpenBao before
  saving. `ssh.transit-keys`
  lists Transit key names under the controller's Transit mount that the
  ssh-agent endpoint presents. `ssh.ca-roles` lists SSH-engine role names
  under the controller's SSH mount for which the endpoint obtains
  certificates. Every key and role named must also be permitted by the HCL
  policy, or the endpoint reports a denial for it.

  Policy inspection and lifecycle compilation use the HCL 1 native and JSON
  dialects consumed by OpenBao ACL policies. Native workload text outside
  exact managed lifecycle stanzas is preserved, including comments and
  multiple attributes on one line. HCL 2 is a separate language/API and
  module (`github.com/hashicorp/hcl/v2`), not a compatible dependency update.
  Renovate allows HCL 1 updates for `github.com/hashicorp/hcl` and excludes
  cross-major replacements. Compatibility follows OpenBao's policy parser,
  not the presence of HCL 2 elsewhere in OpenBao's dependency graph.
  References: https://openbao.org/docs/concepts/policies/,
  https://github.com/openbao/openbao/blob/v2.7.2/internal/vault/policy/policy.go,
  https://github.com/hashicorp/hcl/wiki/Version-Selection.

  `ssh.not-forwardable.transit-keys` and `ssh.not-forwardable.ca-roles`
  select offered identities by their Transit key name or SSH-engine role name.
  Identities are forwardable by default. For a selected identity, signing is
  refused on a connection that has accepted any verified session bind with
  forwarding set. Unbound and non-forwarding connections can still sign.
  Listing is unchanged. The current policy is checked on every sign request.
  These selectors do not add identities to the offered lists. Clients that
  send no forwarding bind are outside this forwarding check.

  `contract.mount-target` is the absolute container path for the consumer
  directory. `contract.env` maps environment names to values; the token
  `{mount-target}` is replaced by the mount target. The default contract sets
  `mount-target` to `/run/wyrwood`, `SSH_AUTH_SOCK` to
  `{mount-target}/ssh-agent.sock`, `VAULT_ADDR` to
  `unix://{mount-target}/vault.sock`.

  A binding selects a nonempty set of policy names. Its settings hold
  `token-ttl` (default `1h`), `token-max-ttl` (default `8h`, at least TTL),
  optional numeric `access-group`, and `enforcement` (`report` by default or
  `recreate`). These fields are rejected in reusable policy documents.
  Effective composition follows `composable-policy-bindings`: HCL source
  union with OpenBao deny and path priority, separate identity unions, any
  not-forwardable restriction, identical mount targets, and equal overlapping
  expanded environment values. Sources, source revisions, effective content,
  settings, and binding revision identify a durable assignment.

  Binding tokens contain exactly the selected `wyrwood-<name>` policies,
  without implicit `default`. Each named policy compiles fixed lookup-self
  read and revoke-self update grants. `openbao.agent-token-renewal` controls
  actual agent renewal and adds renew-self update when enabled. New policies
  enable renewal; omitted settings infer the existing HCL renewal capability,
  including wildcard and deny/path priority. Disabled renewal uses an empty
  exact rule to override broader grants without denying another selected
  policy's update grant. Any selected
  policy enabling renewal enables it for the binding. Exact lifecycle path
  stanzas in authored HCL are replaced by these managed grants; the graphical
  editor exposes the renewal setting and fixed grants separately. The effective
  preview shows compiled lifecycle grants and the resolved setting.

  Container lookup forwards the real binding token and returns safe metadata
  without its value. Container renewal remains local and container revocation
  is blocked. When agent renewal is disabled, the agent retains the token until
  expiry, then requests replacement through existing retry backoff. Access
  stops at expiry if the controller is unavailable. Replacement stops earlier
  retries; retirement cancels expiry and retry work.

  The policy editor also checks path stanzas against configured AppRole,
  Transit, SSH, and `openbao.secret-mounts` roots. The exact lookup-self,
  renew-self, and revoke-self token paths are expected. A complete literal
  mount root must precede any `+` segment or suffix `*`; `kv/*` is contained
  under `kv`, while `kv*` and `+/data/*` can reach other mounts. The check
  reads path stanzas without evaluating capabilities, denies, or path
  priority. Comments are ignored through the existing HCL parser. Unreadable
  HCL produces an advisory that analysis is unavailable. Neither warnings
  nor warning-check failures block saving; OpenBao remains the validity
  authority. The authenticated POST `/policies/warnings` accepts form fields
  `hcl` and `csrf`, returns a JSON `warnings` array, and has no persistence
  or OpenBao side effects. Initial page warnings use the same computation.
  The editor calls this endpoint when the HCL field loses focus and discards
  responses for HCL that changed while the check was pending.

  A policy document contains no secret. The controller stores it in SQLite
  and in OpenBao as compiled HCL with the managed lifecycle grants.
validation-criteria: >-
  A policy conforms when it validates against the JSON Schema asset, when
  OpenBao accepts the HCL, and when every Transit key and SSH role it names
  exists under the configured mounts. Controller tests cover each failure.
