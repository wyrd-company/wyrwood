$schema: https://refinery.systems/ontology/specification
relationships:
  references:
    - configuration
    - operational-events
format: cli
description: >-
  One executable, `wyrwood`, runs in two modes selected by the first argument.

  `wyrwood controller serve` runs the controller with the configuration file
  at `/etc/wyrwood/controller.yml` or the path given by `--config`. It is the
  container image's entrypoint. With `local-agent.enabled`, it also runs the
  shared agent library in-process using the standard agent paths. The agent
  login and query commands also serve this embedded runtime. Either service
  exiting cancels its peer; both finish before controller state closes.
  `wyrwood controller host-key` prints the SSH
  host-key fingerprint from the state volume so an operator can compare it
  with an agent's login prompt.

  `wyrwood controller openbao-admin configure` provisions the dedicated
  namespace OIDC role with secret management on explicitly selected existing
  KV v2 mounts. Required inputs are `--token-file PATH` for a separate
  namespace provisioning credential, `--client-id ID`, `--client-secret-stdin`,
  repeatable `--kv-v2-mount MOUNT`, `--token-ttl DURATION`, and
  `--token-max-ttl DURATION`. Durations are positive whole seconds and the
  maximum is at least the TTL. `--issuer URL` and `--groups-claim KEY` override
  the controller's public defaults. `--config PATH` selects the controller
  document; `openbao.ui-url` supplies the exact browser callback. It never
  reads the runtime AppRole or controller OIDC secret files.
  `wyrwood controller openbao-admin remove --token-file PATH [--config PATH]`
  disables only the owned admin auth mount, revokes its issued sessions, and
  deletes its policy. Both commands support `--output human|json`; errors
  report closed stage, category and partial-configuration state, without
  raw upstream text. No client-secret value is accepted in an argument,
  environment variable or YAML field. The controller policy is unchanged.

  `wyrwood agent login <controller-url>` generates the agent key pair when
  absent, prints its public-key fingerprint, connects to the controller,
  prints the controller's host-key fingerprint, and asks for acceptance unless
  `--accept-fingerprint <fingerprint>` supplies the exact expected value. It
  records the controller URL and accepted fingerprint, then reports whether
  the key is `approved` or `pending`. Login is the only command that accesses
  the agent's durable state directly. `wyrwood agent daemon` runs the agent.
  `wyrwood agent status`, `wyrwood agent containers`, and `wyrwood agent events`
  query the running daemon through its owner-only control socket and accept no
  path override. `containers` lists each observed container with its name, the
  binding key it matched, selected policy names, conformance, token state, and an
  access-group error when the agent cannot assign the contract group. The
  optional JSON field `access-group-error` explains the group membership
  requirement and agent restart.
  `events` defaults to 100 records and accepts `--limit` from 1 through 1000.
  `wyrwood agent engine-proxy [--config PATH]` runs the separate filtering
  Engine boundary from root-controlled configuration. Package hooks use the
  root-only `wyrwood agent service package-install` maintenance action.
  `wyrwood agent service install|remove|start|stop|status` manages the system
  service pair through the Linux service adapter and requires root.

  `wyrwood operator login <controller-url>` selects a key, connects with it,
  prints the controller's host-key fingerprint, and asks for acceptance unless
  `--accept-fingerprint <fingerprint>` supplies the exact expected value. The key
  is a file, by default `operator_key` beside the saved login and generated when
  absent, or with `--key-file PATH` another file, or with `--agent-key SELECTION`
  one key of the SSH agent at `SSH_AUTH_SOCK`, selected by its SHA256 fingerprint,
  its public key, or its comment. A connection offers only that key. `--label NAME`
  proposes the name for a pending key, and defaults to the hostname. Login saves
  the controller URL, host-key fingerprint, label, and key source with owner-only
  mode at `--config PATH`, by default `wyrwood/operator.json` in the user
  configuration directory, and reports whether the key is `approved` or `pending`.
  Each operator command accepts `--config PATH` and uses that saved login.
  `wyrwood operator whoami` prints the key's label and grant.
  `wyrwood policy put <name> --file PATH` creates or changes a policy from an HCL
  file, or standard input with `-`. Repeatable `--transit-key` and `--ca-role`
  replace its SSH identities. `wyrwood policy get <name>` and `wyrwood policy list`
  read policies inside the grant.
  `wyrwood bind --agent NAME --key KIND:VALUE --policy NAME` binds a container key,
  with a repeatable `--policy`, `--access-group GID`, repeatable `--value
  NAME=VALUE`, `--token-ttl`, `--token-max-ttl`, and `--enforcement`. A repeat with
  the same selection returns the binding. `bind` takes no directory name: a key
  that is not `name`, for a container no agent reports, is stored and waits for
  its container to name its consumer directory; the web interface binds such a
  key with a directory name. `wyrwood binding list [--agent NAME]` and
  `wyrwood binding get <id>` read bindings inside the grant with their readiness.
  `wyrwood unbind <id>` or `wyrwood unbind --agent NAME --key KIND:VALUE` removes a
  binding, and succeeds when it is not there. These commands are a thin layer over
  the operator Go package. A failure the controller reports adds its fixed text as
  `message` in JSON.

  `wyrwood version` prints the executable version. Human-readable output is
  the default. `--output json` emits exactly one versioned, closed JSON object
  whose fields match the human projection. Daemon control and its projections
  use version 2. Each container has a `policies` array (empty when unbound)
  and an assignment identity when bound. There is no version 1 adapter or
  singular-policy fallback; CLI and daemon must upgrade together.
  Successful output goes to standard
  output; categorical errors go to standard error and never include raw
  filesystem, engine, SSH, or OpenBao error text.

  Exit status 0 is success. Status 1 is a local operational failure. Status 2
  is usage. Status 3 means the agent key or login state could not be created
  or read. Status 4 means the daemon control socket was unavailable. Status 5
  means the controller refused or did not approve the agent or operator key.
  Status 6 means the controller was unreachable. Status 7 means the host-key
  fingerprint did not match the accepted value. Status 3 also means the operator
  key or saved login could not be read, or no single SSH agent key matches the
  selection. Status 8 means the request is outside the key's grant. Status 9 means
  the policy or binding does not exist. Status 10 means the container key is bound
  to another selection. Status 2 also means the controller refused the request's
  content.
validation-criteria: >-
  Command tests verify exact human and JSON projections for every command,
  categorical exit statuses, that runtime commands use only the control
  socket, that login never prints private-key material, and that no output
  contains a token, secret identifier, or environment value. The Linux
  management gate builds the executable, runs login against a test
  controller, and drives status, containers, and events against a real agent. A
  command test drives each operator command against a real controller.
