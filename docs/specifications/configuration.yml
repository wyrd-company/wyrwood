$schema: https://refinery.systems/ontology/specification
relationships:
  references:
    - command-line-interface
format: json-schema
description: >-
  Wyrwood has two configuration documents, both strict YAML bounded to 1 MiB.

  The agent reads `/etc/wyrwood/agent.yml`, defined by
  `assets/configuration/agent.schema.json`. It records the controller URL,
  the upstream engine socket path, the filtered engine.proxy-socket path,
  whether recreate enforcement is allowed on this
  host, the consumer directory root, and timeouts for engine, controller,
  and OpenBao operations. The agent key pair, accepted controller host-key
  fingerprint, cached policy, and events live under `/var/lib/wyrwood` and
  are not part of the configuration document. Defaults: engine socket
  `/var/run/docker.sock`, filtered socket `/run/wyrwood-engine/engine.sock`,
  recreate not allowed, consumer root
  `/run/wyrwood/containers`.

  The controller reads `/etc/wyrwood/controller.yml`, defined by
  `assets/configuration/controller.schema.json`. It records the HTTP listen
  address, the SSH listen address, the state directory, the OpenBao address,
  CA file, namespace, AppRole mount, role identifier, and the file that holds
  the secret identifier, and the Transit and SSH-engine mount names the
  controller manages. The secret identifier is read from the named file at
  startup and never from an environment variable or the document itself.

  The controller document also records operator sign-in under `oidc`: the
  issuer URL, the client identifier, the file that holds the client secret,
  the public redirect URL ending in `/auth/callback`, the name of the groups
  claim, the allowed groups, and the provider name shown on the sign-in
  button. `oidc` is required and `allowed-groups` must name at least one
  group. The client secret follows the same rule as the AppRole secret
  identifier. `http.session-ttl` bounds an operator session. Defaults: groups
  claim `groups`, session time-to-live 12 hours.

  Timeouts use Go duration syntax between 100 milliseconds and 30 seconds,
  except the OpenBao sign timeout, which allows up to 2 minutes. The session
  time-to-live uses the same syntax between 15 minutes and 24 hours.
validation-criteria: >-
  A document conforms when it validates against its JSON Schema asset and the
  Go parser accepts it with unknown fields rejected. Tests cover defaults,
  bounds, path canonicalization, rejection of inline secrets, and rejection
  of an `oidc` section without allowed groups or with a redirect URL that is
  not absolute.
