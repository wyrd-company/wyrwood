$schema: https://refinery.systems/ontology/idea
relationships: {}
statements:
  A: >-
    Give each container its own stable directory of sockets so that nothing the
    container needs to authenticate is ever stored inside it.
  B: >-
    Let one policy, written with the container in mind, decide which secrets a
    container may read, which keys it may sign with, and what the container
    must look like to receive them.
  C: >-
    Keep every private key and every secret in OpenBao so that rotation,
    revocation, and audit happen in one place.
  D: >-
    Separate the place where policy is written from the host where containers
    run so that one operator can govern many hosts.
