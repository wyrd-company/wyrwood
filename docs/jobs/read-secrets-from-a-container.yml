$schema: https://refinery.systems/ontology/job-to-be-done
relationships:
  articulates: wyrwood
description: >-
  When a tool inside a container needs a secret or an API credential, give it
  an OpenBao endpoint that already carries the container's authority, so the
  tool holds nothing and the container stores nothing.
job-map:
  define: Identify the container and the OpenBao paths its tools read.
  locate: Find the container in the controller and the policy that names those paths.
  prepare: Bind the policy to the container and let the agent apply the contract.
  confirm: Check that the binding is healthy and the vault socket answers inside the container.
  execute: Point each tool at the vault socket and let it read what the policy allows.
  monitor: Watch binding health and denied requests without seeing any secret value.
  modify: Change the OpenBao policy and see the next request observe it.
  conclude: Unbind the container and see its token revoked and its sockets removed.
outcomes:
  - "1":
      importance: 1
      statement: >-
        A tool in the container reads only the OpenBao paths its policy names,
        and a request outside that policy is denied with a categorical reason.
  - "2":
      importance: 2
      statement: >-
        No OpenBao token, role identifier, or secret identifier is readable
        anywhere inside the container.
  - "3":
      importance: 3
      statement: >-
        A policy change takes effect on the next request without a container
        restart.
  - "4":
      importance: 4
      statement: >-
        A tool that insists on logging in before reading still works without
        holding a real credential.
