$schema: https://refinery.systems/ontology/decision-record
status: accepted
relationships:
  contextualizes:
    - composable-policy-bindings
    - controller
description: >-
  A rule such as "each container reads only its own key" needs a policy for each
  container when a policy's paths are fixed, and one wider shared policy would let
  every container read every other container's key. A policy needs a value that
  differs by binding. OpenBao remains the HCL parser and authorization authority, a
  binding's AppRole carries its policies by name, and an operator key that binds
  containers should need no permission to write a policy.
considered-options:
  "1": >-
    Author {{binding.name}}. Compile it to an identity template that reads AppRole
    alias metadata, and carry each value as metadata of the binding's SecretID.
  "2": >-
    Expand values in the controller and publish one OpenBao policy for each expanded
    form. token_policies then names a generated policy for each binding.
  "3": >-
    Store values as entity or alias metadata through the identity API. The controller
    would need identity write grants.
  "4": >-
    Allow the operator key to write policies limited by a name prefix and a
    controller-validated path prefix.
decision-outcome:
  chosen-option: 1
  justification: >-
    Option 1 was tested on OpenBao 2.7.2 with the bounded controller policy: each
    role read exactly its own path, an unset value answered 403, and token policies
    stayed exact. It adds no controller permission and no per-binding OpenBao policy,
    and the policy editor stays the only writer of HCL. Option 2 breaks the exact
    mapping from selected policies to token_policies and multiplies policies and their
    retirement. Option 3 adds a grant that can change any entity in the namespace.
    Option 4 is the fallback for a failed test, and it hands policy authorship to a key
    that needs only to bind. Authors write a placeholder and not the template because
    the template names the mount accessor, which they should not need to look up.
expected-outcomes:
  positive:
    - One policy serves many bindings, and no operator key needs policy write.
    - The controller and OpenBao both refuse wildcards and path separators in a value.
    - A value change uses the existing assignment transition.
  negative:
    - The accessor comes from sys/internal/ui/mounts, an internal endpoint; real-OpenBao tests fail if it changes.
    - Each transition of a binding with values replaces its role identifier and leaves one more unused entity.
    - A token renewal fails between the role delete and the old token's revocation.
