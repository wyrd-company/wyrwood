$schema: https://refinery.systems/ontology/decision-record
relationships:
  contextualizes:
    - ssh-agent-endpoint
    - vault-socket-proxy
description: >-
  Wyrwood previously filtered a host SSH agent by fingerprint allowlist and
  never touched private keys. An agent that runs outside any login session has
  no user SSH agent to proxy, and a fingerprint allowlist cannot express access
  to OpenBao paths. Where keys live and what expresses a container's allowed
  authority must be decided together.
considered-options:
  "1": >-
    Keep the host SSH agent as the key source and add OpenBao beside it.
    Fingerprint allowlists govern SSH; OpenBao policy governs secrets. The agent
    must run inside a user session to reach the host agent.
  "2": >-
    Make OpenBao the only authority. The container's OpenBao policy is the
    allowlist for both secrets and keys. GitHub-class keys live in Transit and
    sign there on every request. Hosts that trust the OpenBao SSH CA receive
    short-lived certificates for a per-container key pair that never leaves
    agent memory. No host SSH agent is read.
  "3": >-
    Make OpenBao the authority for secrets but store SSH private keys in KV
    and load them into the agent's in-memory SSH agent.
decision-outcome:
  chosen-option: 2
  justification: >-
    One authority gives one allowlist, one rotation path, and one audit trail.
    Transit signing keeps the private key out of agent memory entirely; the
    round trip per signature is paid only on git push, pull, and SSH connects,
    which are rare. Option 3 is the same shape but leaves a private key in
    agent memory for no gain. Option 1 keeps two allowlist languages and ties
    the agent to a login session.
expected-outcomes:
  positive:
    - A container's policy document is the complete statement of its authority.
    - No private key exists on any host or in any container.
    - Key rotation is a Transit key version bump with no container change.
    - The agent can run as a system service on a headless host.
  negative:
    - Every SSH signature is an OpenBao round trip.
    - Remote hosts must trust the OpenBao SSH CA or hold a Transit public key.
    - The fingerprint allowlist and host-agent upstream features are removed.
