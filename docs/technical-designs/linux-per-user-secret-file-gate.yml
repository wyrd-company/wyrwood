$schema: https://refinery.systems/ontology/technical-design
relationships: {}
objective: >-
  On a Linux host, serve host-managed secret files into containers so that only
  explicitly trusted reader processes receive the real bytes, every other
  reader receives a redacted copy, writes are confined to trusted readers, the
  mount survives daemon replacement under a running container, and an
  unavailable gate fails closed without disclosing secrets.
background:
  current-design: >-
    Container runtimes bind mount host credential files (SSH agent aside, the
    files that CLIs such as gh, codex, and claude read and rewrite) directly
    into containers. A bind mount grants every process in the container the
    full contents of the file. A file bind mount also pins the mounted inode,
    so replacing the host file or the process that serves it does not update
    what an already-running container sees.
  problems:
    - >-
      A bind-mounted credential file is readable by every process in the
      container, not only the CLI that needs it.
    - >-
      Nothing distinguishes the intended reader from any other same-user
      process that opens the file.
    - >-
      Recreating the served file or restarting its server strands running
      containers on a stale inode.
    - >-
      A server outage can leave the file readable as whatever bytes remain,
      rather than failing closed.
    - >-
      Secrets in these files have no single authority that knows their values,
      so removing them depends on recognizing their shape.
design-challenges:
  origin-identity: >-
    A FUSE filesystem serving a host directory receives the requester's process
    id translated into the daemon's namespace, but only for same-user
    requesters; requests from another user id, including root, are opaque.
    Origin (host versus container) and identity must be derived from the mount
    namespace and process credentials the kernel actually delivers, never from
    caller-controlled strings.
  executable-trust: >-
    An executable's content hash names the file on disk, not the code that runs
    in the process. A dynamically linked reader keeps its approved hash while an
    injected library, a traced ancestor, or an inherited descriptor runs
    attacker code with the reader's identity. Trust must attach to a process the
    attacker cannot influence, not to a file's bytes.
  redaction-completeness: >-
    Removing a secret from a file without breaking the reader that legitimately
    holds it is not achievable by recognizing secret shapes: an unmodeled field,
    a short value, or an encoded representation escapes any pattern. Redaction
    that re-serializes a parsed document can also re-materialize an encoded
    secret it had already removed.
  restart-survival: >-
    Replacing the serving daemon must reach a container that already bound the
    mount. A FUSE mount does not propagate into a running container unless the
    container bound a shared parent and the new mount is published beneath it,
    and a dead mount must be cleared so its removal propagates before the
    replacement is published.
  bounded-failure: >-
    While the gate is unavailable every read must fail closed and loudly, and no
    path may fall back to the unmediated bytes.
  platform-boundary: >-
    A Linux host serves a FUSE mount to a Linux container through a directory
    bind mount, and the mount requires allow_other so the container runtime and
    the reader's user id may traverse it. Docker Desktop places Linux containers
    in a virtual machine with its own file-sharing bridge, so the Linux FUSE
    delivery mechanism is a platform adapter, not a portable assumption.
proposed-design:
  high-level-overview: >-
    One unprivileged Wyrwood daemon runs for each logged-in operating-system
    user. It serves a backing directory of that user's secret files through a
    per-user FUSE mount. On every file operation it identifies the requester
    from the kernel-delivered mount namespace and process credentials. A request
    from a trusted reader receives the real bytes and may write; every other
    request receives a redacted copy and is refused every mutation. The daemon
    knows the exact secret values it is protecting and removes them from the
    bytes served to untrusted readers. The strong guarantee is that only trusted
    readers ever receive real bytes; redaction is a second layer whose output is
    served solely to readers that are expected to fail.
  process-and-ownership: >-
    Wyrwood runs as the target user, reads one configuration file, and stores
    runtime state beneath the user's application directories with owner-only
    permissions. It mounts with default_permissions and allow_other, which
    requires user_allow_other in the host fuse configuration. The daemon's own
    user id and mount namespace are the reference for origin decisions: a
    requester in the daemon's mount namespace is the host user; a requester in a
    different namespace with the daemon's user id is a container process to be
    identified; a requester with any other user id, including container or host
    root, is unidentifiable and is served the redacted copy and refused writes.
  origin-and-identity: >-
    For an identifiable container requester the daemon resolves the requester's
    executable through its process entry and decides trust by the executable's
    content hash, recomputed on every open. It never trusts the executable path,
    command line, or process name, which the caller controls, and never trusts
    the device, inode, or modification time, which a same-user attacker can
    rewrite or restore. The hash is a necessary condition for trust, not a
    sufficient one; it is combined with the reader-trust-model constraints
    below.
  reader-trust-model: >-
    A trusted reader runs under a dedicated user id distinct from the human
    user, so that no attacker-controlled same-user process can trace it, read
    its memory or environment, or open its descriptors. It is statically linked
    or launched with a neutralized loader environment (library preload, library
    path, and plugin directories cleared), so injected code cannot run under its
    identity. It sets its process non-dumpable and never receives a secret
    through its environment. A reader that cannot meet these conditions,
    including every interpreted or attacker-influenceable dynamically linked
    CLI, is not trusted: it stays on the redacted copy or is fronted by a
    native, self-contained shim that owns the file read.
  redaction: >-
    Wyrwood is the authority for the secret values it protects; a value is
    registered by the tool that writes it or by configuration. Redaction
    replaces every registered value, in every encoding the served format can
    carry, computed against the consumer's canonical decoded view of the file
    rather than its raw bytes, so that a later decode cannot restore a removed
    secret. A structural pass that retains only an explicit allowlist of
    non-secret fields, treating every opaque or block region as a single
    redacted unit, is a defense-in-depth backstop for a value that was never
    registered. Redacted output is served only to untrusted readers and is not
    guaranteed to remain valid or complete for its original parser; a reader
    that needs the intact file is trusted and receives the real bytes.
  write-policy: >-
    Every mutating operation is authorized by the same identity check as a read,
    per operation, not once per open. Reads and writes on a handle are
    re-authorized on each call, so a descriptor inherited or passed to a process
    that is no longer trusted loses access. Create, rename, unlink, link,
    symlink, directory removal, node creation, attribute change, and extended
    attribute change from an untrusted requester are refused. Operations the
    gate does not model are refused rather than passed through.
  export-topology-and-restart: >-
    The daemon publishes the mount beneath a dedicated parent directory that
    contains only the mountpoint; backing storage lives outside that parent.
    Each consumer binds the parent directory with shared propagation and
    resolves the served file one level down, so a replacement mount published
    beneath the parent propagates into a running container. Replacing the daemon
    clears the dead mount first, which propagates the removal to the container,
    then publishes the new mount. Full descriptor and kernel-node handover
    between daemon generations is out of scope; parent-directory propagation is
    the supported recovery.
  failure-behavior: >-
    While the daemon is down every read returns a transport error and the
    backing files are never exposed through the mountpoint, which during the
    replacement gap is an empty directory. Credential-writing CLIs observe the
    error and do not proceed; an unreadable or redacted credential is treated by
    a well-behaved CLI as absent rather than as a corrupt value to overwrite.
  configuration-and-secrets: >-
    Configuration names the backing directory, the trusted-reader hashes, and
    the registered secret values, and enables the loader and dumpability
    constraints for trusted readers. Passwordless privilege escalation is
    removed from the container after provisioning, which closes the residual
    path by which a root shell could impersonate a trusted reader; the only cost
    observed is host package installation, which provisioning has already
    completed.
  package-boundaries: >-
    Platform-neutral policy (identity decision, redaction, write authorization)
    is separated from the Linux FUSE endpoint adapter, so the delivery mechanism
    can be replaced for another platform without reworking the policy.
  verification: >-
    The gate is validated against a threat model in which a same-user container
    process, a container root shell, and an ancestor of a trusted reader each
    attempt to recover a secret. Redaction is validated against registered
    values in every supported encoding and against unregistered values through
    the structural backstop, with each mechanism exercised in isolation.
    Restart survival, the fail-closed gap, and per-operation write refusal are
    validated under a running container on the host kernel.
non-goals:
  - >-
    Protecting a secret after it enters a reader an attacker can influence.
    Loader injection, ancestor tracing, and same-user process-memory or
    environment access defeat any file gate; the reader-trust-model constraints
    exist because the filesystem cannot carry this guarantee.
  - >-
    Guaranteeing that redacted output is a valid or complete document for its
    original parser. Redaction fails closed toward disclosure, not toward
    usability, because only readers meant to fail ever receive it.
  - >-
    Serving requesters that are not the daemon's own user id; root and other
    users are always redacted and refused writes.
open-constraints:
  canonical-encoding-redaction: >-
    Value redaction must be proven against every encoding a served format can
    represent a secret in, computed on the consumer's decoded view, before it is
    relied on as more than a best-effort second layer. Until then the security
    guarantee rests on the reader trust model and on redacted output reaching
    only untrusted readers.
  opaque-region-handling: >-
    The structural backstop must treat every block scalar, quoted span, and
    nested region under a non-allowlisted key as a single opaque unit; it must
    not re-parse such a body for allowlisted field names.
