$schema: https://refinery.systems/ontology/technical-design
relationships:
  mitigates:
    - agent-compromise-exposes-host-container-secrets
  assumes:
    - docker-engine-is-the-only-runtime
    - one-controller-per-site
  related-to:
    - controller
    - container-contract
    - vault-socket-proxy
    - ssh-agent-endpoint
    - engine-proxy
objective: >-
  On a Linux host running Docker Engine, observe every container, obtain each
  bound container's OpenBao credential from the controller, enforce the
  container's contract, and publish that container's sockets in a directory
  that survives socket replacement, while holding no secret on disk and
  remaining diagnosable without retaining privileged information.
background:
  current-design: >-
    One unprivileged daemon per logged-in user proxies that user's SSH agent to
    per-consumer sockets configured by hand in a local YAML file.
  problems:
    - Nothing on the host knows which containers exist or when they appear.
    - Consumer sockets must be configured before a container is created.
    - A per-user daemon has no place on a headless server.
    - The only secret the daemon could mediate was a host SSH agent.
design-challenges:
  engine-observation: >-
    The engine event stream can be missed across agent restarts. The agent
    must reconcile the full container list on start and on reconnect, and
    treat events as hints to reconcile rather than as the source of truth.
  credential-lifetime: >-
    Each bound container has an AppRole token that expires. The agent must
    log in, apply the assignment's renewal setting, request replacement credentials, and
    revoke the token when the container goes, without ever writing the token
    to disk.
  controller-absence: >-
    The controller may be unreachable. Existing tokens keep working until
    expiry, cached policy keeps contracts enforceable, and new containers that
    are already bound can still be served if a cached credential is valid.
    New bindings wait.
  socket-replacement: >-
    A bind-mounted socket file pins its inode. Containers mount the consumer
    directory, so the agent replaces sockets inside the directory and never
    the directory itself.
  engine-write-boundary: >-
    The agent reaches Docker through the separate engine-proxy service. The
    proxy reads the host allow-recreate permission from root-controlled
    configuration and denies mutation when it is false. Enabling recreate
    grants arbitrary create authority, including possible host takeover if
    the agent is compromised. The engine-proxy design defines the exact
    method/path allow-list and process permissions.
proposed-design:
  high-level-overview: >-
    The agent is the same Go executable as the controller, run in agent mode as
    a systemd system service under a dedicated `wyrwood` user without
    direct Engine access. It connects to
    the filtered Engine socket, keeps an SSH session
    to the controller, and for every bound container maintains one OpenBao
    token in memory and one consumer directory under `/run/wyrwood/containers/`
    holding a vault socket and an ssh-agent socket. A local owner-only control
    socket serves the command line for login, status, containers, and events.
  configuration-and-identity: >-
    Configuration is `/etc/wyrwood/agent.yml`: controller URL, upstream and
    filtered Engine socket paths, whether
    recreate is allowed on this host, and timeouts. The agent key
    pair is generated by `wyrwood agent login` into `/var/lib/wyrwood/agent_key`
    with owner-only mode; the controller host key fingerprint accepted during
    login is stored beside it. The SSH username is the hostname. Login prints
    the public key fingerprint, connects, displays the controller's host-key
    fingerprint for acceptance, and reports whether the controller has
    approved the key. Nothing else is stored durably except cached policy,
    operational events, and the journal of each recreate in progress.
  engine-observation: >-
    On start the agent lists all containers, then subscribes to engine events
    for create, start, die, destroy, and rename. Each event triggers a
    reconcile of the affected container against the inspect result. The
    inventory sent to the controller contains, per container: engine
    identifier, name, state, image reference, candidate keys in precedence
    order, labels the key precedence needs, and the mounts and environment
    names the contract check needs. Environment values are never reported;
    only names and, for contract fields, whether the value matches.
  controller-session: >-
    The agent dials the controller over SSH with its key, verifies the pinned
    host key, and opens the `wyrwood` subsystem. It sends its inventory on
    connect and after every reconcile, and receives policy and credential
    messages. Reconnection uses bounded exponential backoff. A received policy
    set is written to `/var/lib/wyrwood/policy-cache.json` with owner-only
    mode. Only the version 2 effective-assignment cache is accepted; there is
    no v1 adapter. A restart without the controller can enforce contracts and
    publish sockets for containers whose tokens are still valid.
  credential-lifecycle: >-
    For each bound container the controller supplies an AppRole role
    identifier, assignment identity, and a response-wrapped secret identifier.
    A token is accepted only with exactly the assignment's selected managed
    policy names, without default or any other policy. The agent unwraps,
    logs in, holds the token in memory, and reports the token's accessor to
    the controller after each login, again on each new session and each full
    reconcile until the controller acknowledges it. When the resolved agent-token-renewal
    setting is true, it renews at half the
    remaining time-to-live, asking for the login time-to-live each time, and
    requests a fresh wrapped secret identifier from the controller when
    renewal fails, when the token's maximum lifetime caps a renewal, or when
    the policy push says the binding changed. With renewal disabled it keeps the
    token until its existing expiry, makes no renewal attempts, removes the
    expired credential, and requests replacement through the existing retry
    backoff until delivery or retirement. Without a controller, access stops
    at expiry. Replacement stops the earlier retries; retirement cancels the
    expiry wait and retries. Container renew-self does not extend the token.
    When a bound container is
    destroyed or unbound, the agent revokes the token and removes the consumer
    sockets. Tokens are never logged, never written, and never exposed
    through the control socket.
  consumer-directories: >-
    A consumer directory is `/run/wyrwood/containers/<container-name>/`, owned
    by the agent user, with mode 0750 and the binding's access group, or
    0700 without one. The sockets inside have mode 0660 or 0600 to match.
    The directory is created when a bound container is first observed, or
    when a name binding identifies its mount source before observation. Empty
    agent-owned directories remain after retirement so a manual replacement
    can mount the same directory without Docker creating a root-owned source.
    Listeners close and sockets are removed when the binding is withdrawn.
    Directories with a foreign owner are rejected. Socket
    replacement unlinks and rebinds inside the directory through a pinned
    directory handle so a rename of the directory path cannot redirect
    cleanup. A container that is bound but non-conforming receives a
    directory and sockets anyway; conformance is reported, and the sockets
    are simply unreachable until the mount exists.
  contract-enforcement: >-
    Contract validation and recreate follow the container-contract design. The
    agent exposes the outcome to the controller as conforming,
    non-conforming with the list of failed contract items, recreating, or
    recreated.
  endpoints: >-
    The vault socket follows the vault-socket-proxy design and the ssh-agent
    socket follows the ssh-agent-endpoint design. Both consult the current
    binding on every request so a policy change takes effect on the next
    request on an open connection.
  control-interface: >-
    A local owner-only Unix socket at `/run/wyrwood/control.sock` serves the
    command line. Peer credentials must match the agent user or root. It
    offers status, containers, events, and the login handshake. It does not
    offer policy editing; policy lives on the controller.
  operational-events: >-
    Bounded durable events under `/var/lib/wyrwood/events` record container
    observed, binding received, contract outcome, recreate begun and finished,
    login, renewal, revocation, vault request outcome with the OpenBao mount
    category, ssh identity listing, signing by fingerprint, and certificate
    issuance. Events contain no tokens, secret identifiers, request paths
    beyond the mount category, payloads, signatures, environment values, or
    raw engine or OpenBao errors.
  embedded-runtime: >-
    RunDaemon composes the host agent independently of the CLI. Standalone
    daemon and controller local-agent mode call this entrypoint with identical
    configuration, Engine permission checks, endpoints, and state paths. The
    event writer lock prevents simultaneous runtimes sharing agent state.
  package-boundaries: >-
    The module separates engine observation, controller session, credential
    lifecycle, contract enforcement, consumer directories, the two endpoint
    protocols, control transport, events, and the Linux service adapter.
    Engine access is behind an interface so tests use a fake engine; OpenBao
    access uses the official Go client against a dev server in tests.
  verification: >-
    Unit tests cover reconciliation from events and lists, key precedence,
    token renewal and re-login timing, consumer directory modes and
    replacement, and event redaction by construction. A Linux integration gate
    starts a real engine container, a real OpenBao dev server, and a test
    controller, binds a policy, and verifies the sockets appear in a running
    container, that a policy change is observed on an open connection, that
    the agent restarts without the controller and keeps serving, and that
    destroying the container revokes its token.
