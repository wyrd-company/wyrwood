$schema: https://refinery.systems/ontology/spike
title: FUSE-served secret files for devcontainers

relationships:
  shapes:
    - linux-per-user-secret-file-gate

objective:
  - >-
      Can a FUSE filesystem on a Linux host serve a CLI's credential file into a
      devcontainer so that the CLI receives the real bytes and every other
      process in the container receives a redacted copy?
  - >-
      Does the mount survive the daemon being killed and restarted under a
      running container?
  - >-
      Can the daemon identify the executable that opens a file from the host,
      and which identity (path, device and inode, content hash, command line)
      can an attacker not forge?
  - >-
      Does the identity work for interpreted CLIs (node scripts)?
  - >-
      Can the CLIs that rewrite their own credential files (login, refresh,
      logout) keep working through the gate while other writers are refused?
  - >-
      How do the CLIs behave when the daemon is down?
  - >-
      Does removing passwordless sudo from the container, together with
      Yama `ptrace_scope=1`, close the paths by which a same-user process
      reaches a reader's secret?
  - >-
      Does a gate that identifies the reader's executable contain a secret once
      an attacker can influence the reader?

background:
  current-design: >-
    The devcontainer common feature bind mounts host credential files into the
    container (`gh`, `codex`, `claude`, `cursor-agent`, `npm`, `opencode`,
    `pi`, `seek`, `ssh`, `gnupg`, `pass`, `docker`). A bind mount hands every
    process in the container the full file, and pins the mounted inode, so
    replacing the host file strands a running container on a stale inode. The
    SSH agent is already served through a proxy and is not part of this
    question.
  problems:
    - >-
        Any process in the container, including an agent running arbitrary
        commands, can read every mounted credential.
    - >-
        The CLIs rewrite their credential files in place or by temporary file
        and rename, so a read-only mount does not work for the readers that need
        to log in or refresh.
    - >-
        Nothing in a bind mount distinguishes the CLI that needs a file from any
        other same-user process.

ideas:
  - >-
      Serve the credential directory through a per-user FUSE daemon on the host.
      The daemon reads the requester's process id (delivered by the kernel,
      translated into the daemon's namespace), looks up `/proc/<pid>/exe`,
      `cmdline`, `comm` and `ns/mnt`, and answers allowlisted readers with the
      real bytes and everyone else with a redacted copy.
  - >-
      Tell host requesters from container requesters by comparing the requester's
      mount namespace with the daemon's own.
  - >-
      Bind the FUSE directory into the container with `allow_other` so the
      container runtime (root) and the reader's user id can traverse it.
  - >-
      Open every file with direct IO so a real read does not leave real bytes in
      the page cache for the next reader, and report the size per requester.
  - >-
      Survive daemon replacement by binding a shared parent directory and
      mounting the FUSE directory beneath it, or by handing the `/dev/fuse` file
      descriptor to a re-executed daemon.
  - >-
      Identify the reader by executable content hash instead of path.
  - >-
      Authorize every read and write on the handle, not only the open.
  - >-
      Replace secret values in the redacted copy: first by recognising the file's
      format and secret-named fields, then by replacing the exact secret values
      the daemon is told, backed by a structural allowlist pass.
  - >-
      Remove passwordless sudo from the container after provisioning.

environment:
  location: >-
    A Linux host and a tools devcontainer on that host. The experiment
    apparatus is not retained: it was a go-fuse (v2.11.0) loopback daemon, one
    shell script per question, and small Go helper programs (a temporary-file
    writer, a descriptor opener, a ptrace and memory prober, and an ancestor
    process that scans a child's memory). This record is the only account of it, and it carries each
    measurement it rests on.
  host:
    - CachyOS, kernel 7.2.2, Docker 29.7.2, fusermount3 3.18.2
    - >-
        `user_allow_other` off in `/etc/fuse.conf` at the start; `/` and `/home`
        mounted `shared`; `/home` is a btrfs subvolume; Yama `ptrace_scope=1`
  devcontainer:
    - >-
        The tools devcontainer, with its own root dockerd (docker-in-docker),
        sudo, `/dev/fuse`, fuse3 3.14 with a setuid `fusermount3`, and
        `user_allow_other` enabled for the experiments. The kernel is the host
        kernel. Its root is a `private` mount, so the shared-bind cases of the
        restart question needed a shared bind of the working directory.
  method:
    - >-
        Questions 1 to 6 ran first in the devcontainer. Questions 1 and 2 were
        re-run on the host after `user_allow_other` was enabled there, with the
        same scripts; every case matched the devcontainer result.
    - >-
        Four rounds of experiments followed. After each round an independent
        reviewer (Codex, model gpt-6-astra) read the findings, the code and the
        raw output, and rejected rounds 1 to 4 with findings that the next round
        addressed. The findings below carry the verdict after the last round.
    - >-
        Later rounds ran the reader containers as uid 1000 (`--user`), the uid of
        the daemon and of the real `vscode` remote user. The first rounds ran
        readers as root, where every `/proc/<pid>/exe` is unreadable to the
        daemon and the allow path is masked; the verdicts that depend on the
        allow path come from uid 1000 runs.
    - >-
        The fake credentials are placeholders such as
        `gho_FAKEFAKEFAKEFAKEFAKEFAKEFAKEFAKEFAKE`; no real token was used.
  resources:
    - Container image `ubuntu` with a uid 1000 user, `node:24-slim`, `gcc:13`
    - >-
        The `ghcr.io/wyrd-company/devcontainers/base:resolute` image and a copy
        of the common feature 10.3.0 (mounts and customizations removed) for the
        sudo question

findings:
  secret-bearing-mounts:
    verdict: observed
    notes: >-
      Observed in a running devcontainer built from common feature 10.3.0. "Rewrites" means the CLI
      writes the file itself (login, refresh, logout). "Prints" means a normal subcommand emits the
      secret. "Reader" is the process that opens the file after any wrapper script. Native readers
      with a rewrite path: `gh`, `codex`, `claude`, `opencode`, `docker`. Interpreted readers:
      `cursor-agent`, `npm`, `pi`. Read-only mounts with no rewrite: `.npmrc`, `seek`, `gnupg`,
      `password-store`, `ssh`.
    inventory:
      - >-
          `gh` `~/.config/gh/hosts.yml` (`oauth_token`): rewrites on login, logout and refresh, and
          the `gh` wrapper re-authenticates as the bot; prints with `gh auth token` and `gh auth
          git-credential get`; native Go binary behind a bash wrapper.
      - >-
          `codex` `~/.codex/auth.json` (`OPENAI_API_KEY`, `tokens.access_token`, `id_token`,
          `refresh_token`): rewrites on login and refresh; native Rust binary that the npm
          `codex.js` launcher spawns from `vendor/x86_64-unknown-linux-musl/bin/codex`.
      - >-
          `claude` `~/.claude/.credentials.json` (`claudeAiOauth.accessToken`, `refreshToken`,
          `mcpOAuth.*`): rewrites on login and refresh; native bun-compiled binary at
          `~/.local/share/claude/versions/<v>`.
      - >-
          `claude` `~/.claude/github.pem` (RSA private key of a GitHub App): no rewrite, no print;
          read by native Go `gh` through `gh token generate`.
      - >-
          `~/.claude.json`: no secret observed (usage counters, project state); rewritten by
          `claude`.
      - >-
          `cursor` `~/.config/cursor/auth.json` (access and refresh tokens): rewrites; read by
          `cursor-agent`, a shell script that runs a vendored `node` on a bundled script
          (interpreted).
      - >-
          `~/.npmrc` (read-only mount; `_authToken`): prints with `npm config get`; read by `npm` on
          `node` (interpreted).
      - >-
          `opencode` `~/.local/share/opencode/auth.json` (`key`): rewrites; native bun-compiled
          binary.
      - >-
          `pi` `~/.pi/agent/auth.json` (`key`): rewrites; `pi` on `node` (interpreted).
      - >-
          `seek` `~/.config/seek/config.json` (read-only mount; `*_API_KEY` for six providers):
          native bun-compiled binary.
      - >-
          `ssh` `~/.ssh` (`id_github` private key): read by native `ssh` and `git`; the agent proxy
          already covers signing.
      - >-
          `gnupg` `~/.gnupg` (read-only; `pubring.kbx` and `trustdb.gpg`, no private keys, agent
          socket served) and `password-store` `~/.password-store` (read-only; gpg-encrypted entries;
          `pass show` prints by design).
      - >-
          `docker` `~/.docker/config.json` (`auths`, empty at the time): rewrites on `docker login`;
          native binary.
      - >-
          `openobserve`, `lore.yml` and `gh-claim-issue-config.yml`: service tokens where
          configured.

  allow-other-is-a-host-prerequisite:
    verdict: confirmed
    notes: >-
      Measured: the first host runs failed before any container started.
      dockerd runs as root and `stat`s the bind source, and a user FUSE mount
      without `allow_other` denies root: `invalid mount config for type "bind":
      stat .../mnt/gh: permission denied`, confirmed with `nsenter -t 1 -m
      stat` as root. `allow_other` needs `user_allow_other` in
      `/etc/fuse.conf`, a one-line root change. With it enabled on the host
      and in the devcontainer, every later case ran. Root processes, in the
      container or on the host, are then opaque to a uid 1000 daemon (see
      `executable-identity`), so the daemon must also check the requester's
      uid.

  restart-under-a-running-container:
    verdict: fails without a shared parent bind; holds with one
    notes: >-
      Measured, in the devcontainer and then on the host with the same result.
      Case A, the container binds `mnt/gh` with default propagation: after the
      daemon is killed and remounted the container reads `cat:
      /secrets/gh/hosts.yml: Transport endpoint is not connected` forever,
      because it holds the dead mount. Case B, the same bind with
      `bind-propagation=rshared`: identical, because the new mount lands on the
      parent and the container's bind is of the old FUSE mount's subtree, which
      is not a peer of the parent. Case B2, the container binds the parent
      directory of the mountpoint with `rshared` and the daemon mounts at
      `parent/mnt` after the container started: the new mount propagates, reads
      recover, `mountinfo` inside the container shows a new `fuse.secretfs`
      mount (`0:198` under the btrfs `/home` subvolume bind `shared:205` on the
      host), and the gate still redacts for `cat` (`oauth_token: REDACTED`).
      Case C, the daemon re-executes itself on SIGUSR1 and passes the
      `/dev/fuse` descriptor: the kernel keeps its node table, the new process
      panics on the first GETATTR with `unknown node 2` (later `unknown node
      8`), and readers get `Input/output error`; go-fuse offers no transfer of
      kernel node ids or open handles, so a handover would need state transfer
      that the library does not support. Docker requires the bind source to
      sit inside a `shared` mount; the host's `/home` is one. Consequences for
      the design: every consumer binds the parent directory, not the served
      subpath, and resolves the per-CLI path inside it (a symlink or a CLI
      configuration variable). While the daemon is down every read returns
      `ENOTCONN`.

  safe-export-topology:
    verdict: holds
    notes: >-
      Measured, after review found that the first B2 run bound the whole
      working directory, which also held the backing directory, so the
      container could read the real files at `/secrets/backing/...` without
      FUSE. The corrected topology exports a parent that contains only the
      mountpoint, with backing storage outside it. Output: the container
      lists `/export` as `secrets` only; `ls: cannot access '/export/backing':
      No such file or directory`; `cat: /export/backing/gh/hosts.yml: No such
      file or directory`; `no real token reachable under /export`. With the
      daemon killed, `cat: /export/secrets/gh/hosts.yml: Transport endpoint
      is not connected` and `ls: cannot access '/export/secrets': Transport
      endpoint is not connected`; backing is never exposed. Recovery needs one
      step the first run missed: the dead mount must be cleared with
      `fusermount3 -uz`, which propagates the removal into the container,
      before the new mount is made; otherwise the container keeps the dead
      endpoint. After that the new `fuse.secretfs` propagates in and reads
      recover, redacted for `cat`. In the gap between clearing the dead mount
      and mounting the new one, host and container both list an empty
      directory and `cat` reports `No such file or directory`; the real bytes
      are not reachable in either state. A lazy unmount on the host did not
      change what the running container saw (still the dead mount). Not
      measured: a real CLI login or refresh that starts during the gap.

  executable-identity:
    verdict: holds with the content hash; path, inode and command line fail
    notes: >-
      Measured. FUSE delivers the requester's pid translated into the daemon's
      pid namespace. For a same-uid requester the daemon reads
      `/proc/<pid>/exe`, `cmdline`, `comm` and `ns/mnt`; a container requester
      has a mount namespace different from the daemon's, which separates
      container from host origin (`"origin":"container"` against
      `"origin":"host"` in the log). Path: an attacker image whose
      `/usr/bin/cat` is a different binary was admitted by a path allowlist;
      the log shows `"exe":"/usr/bin/cat"`, `"exe_sha256":"bba6734e..."` (the
      hash of `head`, against `a63158e6...` for the genuine `cat`) and
      `"decision":"real"`. Device and inode: the same image gave `exe_dev`
      195 in one container and 177 in another for the same inode, and a copy at
      `/tmp/cat2` had a different inode; the pair is not stable across
      containers. Content hash: the genuine `cat`, its copy at `/tmp/cat2` in
      two containers, and nothing else produced `a63158e6...`; the spoof
      produced `bba6734e...`. A hash costs one read of the executable per open.
      Command line and `comm` are set by the caller. Root in the container
      (uid 0, including `docker exec -u 0`) is opaque to the uid 1000 daemon:
      `"exe":"ERR:readlink /proc/1870033/exe: permission denied"`,
      `"decision":"redacted"`. Root-run CLIs therefore cannot be allowlisted,
      and the gate fails closed for root. The same holds for host root when
      `allow_other` is on. A mount of a different binary over `/usr/bin/cat`
      from inside the container was refused (`mount: /usr/bin/cat: permission
      denied`). Hash enforcement as the only rule (no path allowlist): an
      allowlisted `/bin/cat` read the real token, a byte-identical copy at
      another path read the real token, a different binary read `REDACTED`, and
      overwriting an allowlisted copy's bytes turned its reads to `REDACTED`.
      Direct IO: an allowlisted `cat` reading real bytes did not leave them
      in the page cache for a following non-allowlisted `head` (which read
      `REDACTED`), and getattr size is per requester (150 redacted bytes
      against 214 real). The page-cache result and the size comparison were
      reported by the experiment session; no output that shows both sides was
      retained, so they rest on the session's account.

  hash-cache-keyed-on-writable-metadata:
    verdict: fails; re-hash on every open
    notes: >-
      Measured. A cache keyed on (mount namespace, device, inode, mtime)
      worked and invalidated on an mtime change (`hashcache hits=16 misses=6
      entries=6`). All four key parts are writable by a same-uid attacker:
      with the cache trusted, the attacker overwrites an allowlisted copy with
      the bytes of `head`, restores the original mtime
      (`2026-01-23 13:30:04`) and reads the real token; with every open
      re-hashed (the default), the same attack reads `REDACTED`. The cache must
      not gate access.

  interpreted-clis:
    verdict: fails
    notes: >-
      Measured: for a `node` reader the daemon logs `"exe":"/usr/local/bin/
      node"`, `"comm":"MainThread"` and `"exe_sha256":"89af8424..."` for every
      script. The only identity of the script is `cmdline`, which the caller
      sets. Reported by the experiment session, with no output retained: `exec
      -a /usr/local/bin/gh node /tmp/gh` logged `cmdline`
      `/usr/local/bin/gh /tmp/gh`; `process.title` rewrote both `cmdline` and
      `comm`; a vendored node copy (the `cursor-agent` layout) hashed
      identically to the system node. The retained transcripts of the spoof attempt
      show it failing (`SyntaxError` in the host run, `exec: -a: not found` in
      the devcontainer run), so they prove nothing. If the reported results hold,
      allowlisting node by hash admits every script run by any node. Affected:
      `cursor-agent`, `npm` (`.npmrc`) and `pi`. Remaining routes: a native
      shim that owns the file read, or leaving them on the harness-hook layer.

  write-path:
    verdict: holds for allowlisted writers; narrowed for the full operation set
    notes: >-
      Measured. An allowlisted temporary-file writer (create, rename over
      `hosts.yml`): the rename landed in the backing directory and a
      non-allowlisted `cat` read the new file redacted
      (`oauth_token: REDACTED`). A byte-identical binary at another path was
      refused (`open /secrets/gh/.tmp-hosts.yml: permission denied`); `rm`
      was refused (`rm: cannot remove '/secrets/gh/hosts.yml': Permission
      denied`) and the backing file was unchanged. Real `gh`, allowlisted:
      `gh auth status` read the real token; `gh auth logout` rewrote
      `hosts.yml` in place (open, setattr truncate, write; the backing file
      became `{}`) and created `config.yml`; `gh config set git_protocol`
      wrote `config.yml`; `gh auth login --with-token` with a fake token was
      validated against the API first (`error validating token: HTTP 401: Bad
      credentials`) and wrote nothing. From a non-allowlisted writer, `open`
      for write, create, rename, unlink and setattr return `EACCES`. The first
      gate wrapped only those operations, and review showed that the loopback
      defaults let a same-uid caller hardlink a credential out or plant a
      symlink. With a guard on every mutating operation: `ln: failed to create
      hard link 'stolen.hardlink' => 'hosts.yml': Permission denied`, `ln:
      failed to create symbolic link 'stolen.symlink': Permission denied`,
      `rmdir: failed to remove '/secrets/codex': Permission denied`,
      `mknod: /secrets/gh/fifo: Permission denied` (a FIFO needs no privilege,
      so it reaches the gate), and the backing directory showed none of those
      artifacts. Not exercised at runtime: `setxattr` (`setfattr` was absent
      from the base image), so its guard is untested for both an allowlisted
      and a non-allowlisted writer. `Getxattr`, `Readlink`, `Fallocate` and
      `CopyFileRange` handling (denied with `ENOTSUP` on a gated handle) rests
      on reading the code, with no transcript.

  per-read-authorization:
    verdict: confirmed required
    notes: >-
      Measured. Authorizing at open returns a plain handle, so a descriptor
      opened by an allowlisted reader and inherited by another process keeps
      its access. An allowlisted `fdopener` opened the credential, then
      executed a non-allowlisted `head` that read the inherited descriptor
      from stdin: with open-time gating `head` printed the real
      `oauth_token: gho_FAKE...`; with every read re-authorized it printed
      `REDACTED`. The same with an `O_RDWR` handle where the non-allowlisted
      process also writes: open-time gating gave the real token and `WRITE
      ACCEPTED (leak)`; per-read and per-write gating gave `REDACTED` and
      `write denied`. A descriptor passed over `SCM_RIGHTS` was not tested
      separately. Per-read gating is the only safe mode.

  failure-behavior:
    verdict: holds while the daemon is down; later states partly unmeasured
    notes: >-
      Measured with the daemon killed and the mount left dangling, readers
      not allowlisted. Every CLI failed loudly and wrote nothing: `gh`
      `failed to read configuration: open /home/u/.config/gh/config.yml:
      transport endpoint is not connected`; `codex` `Error loading
      configuration: failed to read CODEX_HOME "/home/u/.codex": Socket not
      connected (os error 107)`; `gh auth login --with-token` refused before
      writing. `claude auth status` printed `"loggedIn": false` in every state,
      including daemon up with a redacted credentials file, so Claude Code
      treats an unreadable or redacted credential as absent. `npm config get`
      refuses to print `_authToken` by policy (`option is protected`) and did
      not fail on the unreadable `.npmrc`. With a daemon up and a redacted
      file, `codex login status` failed with `expected value at line 1 column
      42`: redacted output breaks a parser, which is the intended outcome for a
      reader that is not trusted. Restarting the daemon did not change what
      the running container saw under a subpath bind (`transport endpoint is
      not connected` throughout), the topology that `restart-under-a-running-
      container` rejects. Not measured: any CLI's behavior under the safe
      export topology, and a login or refresh by an allowlisted reader that
      starts while the mount is gone or being replaced. A later interactive
      login by a non-allowlisted writer would be refused by the write gate.

  ptrace-and-process-access:
    verdict: same-user non-descendant ptrace is closed; ancestor tracing and environ are open
    notes: >-
      Measured with container user uid 1000, Yama `ptrace_scope=1`, default
      Docker profile. Plain container, user with and without passwordless
      sudo: `PTRACE_ATTACH` on a same-uid non-descendant returned `operation
      not permitted`, `/proc/<pid>/mem` `permission denied`; `sudo cat
      /proc/<pid>/environ` as root without `SYS_PTRACE` in its bounding set
      returned `Permission denied`; `--cap-add SYS_PTRACE` did not change the
      result for the unprivileged user (the capability lands in the bounding set
      only). Same-uid non-descendant, uid 1000: `PTRACE_ATTACH: operation not
      permitted` and `open /proc/7/mem: permission denied`, but
      `/proc/<pid>/environ` is readable and recovered a secret environment
      value (`recovered_canary=true`), because Yama scope 1 gates
      `PTRACE_MODE_ATTACH` and not `PTRACE_MODE_READ`. A secret that a CLI
      carries in its environment is exposed to every same-uid process. Ancestor
      tracing: an attacker that launches the allowlisted reader as its own
      child can read the child's environ, `/proc/<pid>/mem`, use
      `process_vm_readv` and `PTRACE_ATTACH`/`GETREGS`, all of which succeeded;
      against an allowlisted child that loaded the credential into memory the
      ancestor recovered the real token (`recovered credential from child
      memory (needle="gho_FAKE"): true`). A negative control, the ancestor of a
      credential-free `sleep`, reported `false`, and the child's environment
      was stripped of the needle (`child environ contains canary-1234:
      false`), so the match proves the child read the credential. A
      same-uid non-descendant that opens `/proc/<pid>/fd/N` of the reader's
      held credential re-enters FUSE as itself and reads `REDACTED`. As
      container root, `ls /proc/7/fd` lists the entries but every symlink
      reads `Permission denied` without `CAP_SYS_PTRACE`. Inferred, not
      measured: `sudo su vscode -c <allowlisted cli>` and a root read of
      `/proc/<pid>/fd` remain open while passwordless sudo exists.

  passwordless-sudo-removal:
    verdict: holds
    notes: >-
      Measured on the host with a throwaway devcontainer built from a copy of
      the common feature on `ghcr.io/wyrd-company/devcontainers/base:resolute`,
      `postCreateCommand` run, then `/etc/sudoers.d/*` removed and `NOPASSWD`
      stripped from `/etc/sudoers`. `sudo -n true` changed from `SUDO_OK` (exit
      0) to `sudo: a password is required` (exit 1). After removal these
      worked: `brew install jq`, `npm i -g cowsay`, `chown -R vscode:vscode`
      on already-owned trees, `task` 3.53.1, `gh` 2.99.0, `claude` 2.1.263,
      `codex` 0.153.4, `cursor-agent` 2026.09.02. These failed: `apt-get install`
      (`Could not open lock file /var/lib/dpkg/lock-frontend ... are you
      root?`), plus `docker` and `pip3` which the container did not contain
      (`command not found`). The feature's only sudo
      callers are the `own-*` post-create `chown`s, each wrapped in `|| true`,
      and no script under `~/.local/bin` calls sudo. Revoking passwordless sudo
      after post-create costs `apt` and any root-owned late-arriving mount.

  content-hash-is-not-trusted-execution:
    verdict: confirmed defeat
    notes: >-
      Measured. `/bin/cat` is dynamically linked (`linux-vdso.so.1`,
      `libc.so.6`, `ld-linux-x86-64.so.2`) and was allowlisted by hash. Run as
      uid 1000 with `LD_PRELOAD=/tmp/evil.so`, a constructor in the library
      read the credential and exfiltrated it to an attacker-readable target; the
      target held the real `oauth_token: gho_FAKE...` while `sha256sum
      /bin/cat` still printed `a63158e6...`, the allowlisted hash. No sudo and
      no ptrace were involved: `RESULT: LEAKED real token via LD_PRELOAD while
      exe hash unchanged`. A hash names the file on disk, not the code that
      runs in the process, so a dynamically linked reader is not a security
      boundary unless its loader environment (`LD_PRELOAD`, `LD_LIBRARY_PATH`,
      plugin directories) is constrained, or the reader is statically linked.

  redaction:
    verdict: not established as fail-closed; best effort only
    notes: >-
      Measured across four rounds, each of which review rejected. Format-aware
      redaction (parse JSON and re-marshal with secret-named values replaced,
      match YAML and ini lines by key, strip PEM bodies) failed open on: a
      `codex` file that came out as `"tokens": REDACTED "eyFAKE.FAKE.FAKE"`
      (invalid JSON, with `access_token` surviving); bare `key` fields; PEM
      keys; a CRLF PEM; a truncated PEM; `oauth_token: |` block scalars,
      `oauth_token: | # comment` and `|2`; and short JSON values such as `pin`
      and `session`. A denylist of key names or a length heuristic cannot fail
      closed, because an unmodelled key or a short value always escapes. A
      post-pass scan for token-shaped runs that collapses the file to
      `REDACTED` closed the CRLF, truncated-PEM and block-scalar fixtures
      (`RESULT: no canaries survived (fail-closed)`), and a legitimate `gh` file
      stayed readable for an allowlisted reader. The model that replaced it is
      value-based: the daemon is told the exact secret values (from the tools
      that write them or from configuration) and replaces each byte for byte,
      independent of format, key name or length, then runs a structural pass
      that keeps scalar values only under an explicit list of safe keys. With
      it, the same short PIN was redacted under an unmodelled JSON key
      (`"weird_unmodeled_key": "REDACTED"`) and in a freeform log (`REDACTED`),
      and a `gho_` token in YAML, while a legitimate `gh` file kept `user` and
      `git_protocol`. Review then showed three defects. (1) Value replacement
      works on raw bytes and the structural pass then re-serializes: in
      `{"user":"\u0070in4931"}` the escape `\u0070` hides the bytes
      `pin4931` from the replacement, `json.Unmarshal` decodes it to `p`, and
      the re-emitted document holds plaintext `pin4931`; base64, hex and
      URL-encoded forms under safe keys survive the same way. Redaction must
      run on the canonical decoded form the consumer sees and cover every
      encoding of a known value, so "any format" must narrow to declared,
      canonicalized representations. (2) The structural backstop treats a line
      inside a block scalar that looks like `user: <secret>` as a safe mapping
      field and keeps it, and an indentless YAML sequence under an unsafe key
      survives; an opaque body must be redacted wholesale. (3) The value-based
      fixtures were all also masked by the structural pass, so the run did not
      show that value replacement did anything; a fixture needs a known value
      under a safe key that leaks without the secrets list and is redacted
      with it. Redacted output is served only to readers that are not
      allowlisted and are meant to fail, so it is deliberately over-redacted
      and not guaranteed to be a valid or complete document. Defects (1) to
      (3) were not fixed or retested.

  build-observations:
    verdict: observed
    notes: >-
      Reported from the build of the throwaway devcontainer, unrelated to the
      gate. Common feature 10.3.0 depended on
      `ghcr.io/wyrd-company/devcontainers/cursor-cli:1`, which was never
      published (the feature is `cursor-agent-cli`); the owner approved the fix
      on the host. The caddy feature refuses base images that are not s6.
      `npm` 11 blocks the `agent-browser` postinstall script, so that
      post-create step fails on current npm regardless of mounts.

conclusion: >-
  The gate mechanism holds. A per-user FUSE daemon tells container from host
  requesters by mount namespace, identifies a same-uid reader by the content
  hash of its executable (never by path, device and inode, command line or
  `comm`), re-hashes on every open, authorizes every read and write on the
  handle including inherited and `O_RDWR` handles, guards every mutating
  operation, serves nothing but a dead-mount or empty-directory error while it
  is down or being replaced, and recovers under a running container when the
  consumer binds a shared parent directory that contains only the mountpoint
  and the dead mount is cleared before the new mount is made. Root, in the
  container or on the host, is unidentifiable and always receives the redacted
  copy. Four things do not hold. Interpreted CLIs cannot be identified by
  executable, so `cursor-agent`, `npm` and `pi` stay outside the gate or move
  behind a native shim. Hashing the executable is not trusted execution:
  `LD_PRELOAD` injected code into an allowlisted dynamically linked `cat` and
  read the real token under an unchanged hash, an ancestor that launches the
  reader recovers the token from its memory, and a same-uid process reads a
  reader's environment. The file gate cannot protect a secret once it enters a
  reader an attacker can influence, so the reader's trust model is the subject
  of the design. The experiments recommend, and did not run, trusted readers
  under a dedicated uid, statically linked or with a locked-down loader, with
  `PR_SET_DUMPABLE=0` and no secrets in their environment. Redaction is not a
  proven control: value-based replacement is the right model, but it needs
  canonical-form and all-encoding coverage and an opaque-region backstop that
  the experiments did not build, so the guarantee rests on the reader trust
  model and on redacted output reaching only readers that are meant to fail.
  The host needs `user_allow_other`, and removing passwordless sudo after
  provisioning costs `apt` only. The gate was measured on one Linux host with
  Docker Engine; Docker Desktop and other platforms were not tried.

next-steps:
  - >-
      Measure value-based redaction on the consumer's canonical decoded form
      with every encoding of a registered value (JSON escapes, base64, hex,
      URL encoding) under safe and unsafe keys, with a fixture that isolates
      value replacement from the structural pass.
  - >-
      Measure the structural backstop with block scalar bodies, quoted spans and
      indentless sequences under non-allowlisted keys treated as single opaque
      units.
  - >-
      Measure a trusted reader under a dedicated uid with `PR_SET_DUMPABLE=0`, a
      locked-down loader and no secrets in its environment, against the
      `LD_PRELOAD`, ancestor-tracing and same-uid environ attacks that defeated
      the hash-only reader.
  - >-
      Measure how the daemon recognizes a non-dumpable reader: a non-dumpable
      process hides `/proc/<pid>/exe` from a same-uid daemon, so the hash-based
      identity needs a launch-time attestation that the experiments did not try.
  - >-
      Measure a real CLI login or refresh by an allowlisted reader that starts
      while the dead mount is cleared and the new mount is not yet published, and
      every inventoried CLI's behavior under the safe export topology.
  - >-
      Run `setxattr` from allowlisted and non-allowlisted writers with an image
      that has `setfattr`, and test a descriptor passed over `SCM_RIGHTS`.
  - >-
      Re-run the interpreted-CLI spoof (`exec -a`, `process.title`, vendored
      node) and the direct IO page-cache and per-requester size checks with the
      output kept, because only the session's account of them survives.
  - >-
      Decide which native shim, if any, serves `cursor-agent`, `npm` and `pi`, or
      whether they stay on the harness-hook layer.
  - >-
      Measure the delivery mechanism on Docker Desktop, where Linux containers
      run in a virtual machine behind a file-sharing bridge.
